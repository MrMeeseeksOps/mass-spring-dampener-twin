[project]
name = "mass-spring-digital-twin"
version = "0.1.0"
description = "A simulated mass–spring–damper digital twin laboratory"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1", "scipy>=1.14", "plotly>=5.24", "streamlit>=1.40", "pydantic>=2.9"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/mass_spring_twin"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
